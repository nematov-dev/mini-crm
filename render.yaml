# Render Blueprint: one-click deploy of the whole app.
# https://render.com/deploy?repo=https://github.com/nematov-dev/mini-crm
databases:
  - name: mini-crm-db
    plan: free
    databaseName: crm
    user: crm

services:
  - type: web
    name: mini-crm
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: mini-crm-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: SEED_DEMO_DATA
        value: "true"
